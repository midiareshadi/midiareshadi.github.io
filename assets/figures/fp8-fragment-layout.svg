  <g fill="#eeece4" stroke="#888780" stroke-width="0.5"><rect x="422" y="224" width="42" height="34" rx="3"/><rect x="464" y="224" width="42" height="34" rx="3"/></g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="191" y="245">T28</text><text x="233" y="245">T28</text><text x="275" y="245">T29</text><text x="317" y="245">T29</text>
    <text x="359" y="245">T30</text><text x="401" y="245">T30</text><text x="443" y="245">T31</text><text x="485" y="245">T31</text>
  </g>
  <text x="340" y="300" text-anchor="middle" font-size="14" fill="#2b2b2b">Get one thread's piece in the wrong slot,</text>
  <text x="340" y="322" text-anchor="middle" font-size="14" fill="#2b2b2b">and the whole result is wrong.</text>
