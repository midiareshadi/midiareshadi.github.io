<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="Georgia, 'Times New Roman', serif">
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">One matrix, split across 32 threads</text>
