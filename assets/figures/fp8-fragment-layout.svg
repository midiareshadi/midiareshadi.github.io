    <text x="359" y="125">T2</text><text x="401" y="125">T2</text><text x="443" y="125">T3</text><text x="485" y="125">T3</text>
  </g>
  <text x="340" y="170" text-anchor="middle" font-size="16" fill="#555">. . .</text>
  <g fill="#e6def2" stroke="#7f77dd" stroke-width="0.5"><rect x="170" y="190" width="42" height="34" rx="3"/><rect x="212" y="190" width="42" height="34" rx="3"/></g>
  <g fill="#fbeaf0" stroke="#d4537e" stroke-width="0.5"><rect x="254" y="190" width="42" height="34" rx="3"/><rect x="296" y="190" width="42" height="34" rx="3"/></g>
  <g fill="#eaf3de" stroke="#639922" stroke-width="0.5"><rect x="338" y="190" width="42" height="34" rx="3"/><rect x="380" y="190" width="42" height="34" rx="3"/></g>
