  <g fill="#d5ebe3" stroke="#1d9e75" stroke-width="0.5"><rect x="338" y="70" width="42" height="34" rx="3"/><rect x="380" y="70" width="42" height="34" rx="3"/></g>
  <g fill="#faeeda" stroke="#ba7517" stroke-width="0.5"><rect x="422" y="70" width="42" height="34" rx="3"/><rect x="464" y="70" width="42" height="34" rx="3"/></g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="191" y="91">T0</text><text x="233" y="91">T0</text><text x="275" y="91">T1</text><text x="317" y="91">T1</text>
    <text x="359" y="91">T2</text><text x="401" y="91">T2</text><text x="443" y="91">T3</text><text x="485" y="91">T3</text>
  </g>
  <g fill="#cfe0f2" stroke="#3b6ea5" stroke-width="0.5"><rect x="170" y="104" width="42" height="34" rx="3"/><rect x="212" y="104" width="42" height="34" rx="3"/></g>
  <g fill="#f3d9cc" stroke="#b5623a" stroke-width="0.5"><rect x="254" y="104" width="42" height="34" rx="3"/><rect x="296" y="104" width="42" height="34" rx="3"/></g>
  <g fill="#d5ebe3" stroke="#1d9e75" stroke-width="0.5"><rect x="338" y="104" width="42" height="34" rx="3"/><rect x="380" y="104" width="42" height="34" rx="3"/></g>
  <g fill="#faeeda" stroke="#ba7517" stroke-width="0.5"><rect x="422" y="104" width="42" height="34" rx="3"/><rect x="464" y="104" width="42" height="34" rx="3"/></g>
  <g font-size="12" fill="#333" text-anchor="middle">
