  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="191" y="211">T28</text><text x="233" y="211">T28</text><text x="275" y="211">T29</text><text x="317" y="211">T29</text>
    <text x="359" y="211">T30</text><text x="401" y="211">T30</text><text x="443" y="211">T31</text><text x="485" y="211">T31</text>
  </g>
  <g fill="#e6def2" stroke="#7f77dd" stroke-width="0.5"><rect x="170" y="224" width="42" height="34" rx="3"/><rect x="212" y="224" width="42" height="34" rx="3"/></g>
  <g fill="#fbeaf0" stroke="#d4537e" stroke-width="0.5"><rect x="254" y="224" width="42" height="34" rx="3"/><rect x="296" y="224" width="42" height="34" rx="3"/></g>
